# Residential TOU tariff -- BUILD_SPEC.md §9.
#
# Window structure (peak/shoulder/off-peak hours and the summer+winter-only
# peak season) is modelled on Ausgrid's current residential TOU network
# periods (source: "Ausgrid residential TOU network periods, 2025-26").
# The $/kWh rates themselves are representative retail values (a typical
# retailer's residential TOU offer on top of that network tariff), not a
# specific retailer's published price list -- CONFIRM against a current
# retail plan before results are reported.
#
# Units: rate is $/kWh. `tariff.rate_at(t, date)` returns (rate, is_cpp) for
# a 30-min step `t` (0..47) on a given calendar `date` -- weekday, month
# (for the seasonal peak window), and CPP-event lookup all depend on the
# date. windows are half-open [start, end); an `end` earlier than `start`
# wraps past midnight (e.g. 22:00 -> 07:00). A window with no `months` key
# applies year-round; peak's `months` restricts it to summer (Nov-Mar) and
# winter (Jun-Aug) -- Apr-May and Sep-Oct fall through to the shoulder rate
# for the whole day (no third "shoulder season" window is needed: outside
# peak months, 15:00-21:00 matches no window and `rate_at` defaults to
# shoulder).

rates:
  peak:
    rate: 0.55           # representative retail $/kWh
    windows:
      - days: [mon, tue, wed, thu, fri, sat, sun]
        start: "15:00"
        end: "21:00"
        months: [11, 12, 1, 2, 3, 6, 7, 8]  # summer (Nov-Mar) + winter (Jun-Aug)
  shoulder:
    rate: 0.28            # representative retail $/kWh
    windows:
      - days: [mon, tue, wed, thu, fri, sat, sun]
        start: "07:00"
        end: "15:00"
      - days: [mon, tue, wed, thu, fri, sat, sun]
        start: "21:00"
        end: "22:00"
  off_peak:
    rate: 0.22            # representative retail $/kWh
    windows:
      - days: [mon, tue, wed, thu, fri, sat, sun]
        start: "22:00"
        end: "07:00"

# CPP (Critical Peak Pricing) events: synthetic and configurable, on flagged
# calendar dates a window overrides the normal schedule with a price spike
# to stress-test elasticity (§9, §10). Two severities are defined for
# sensitivity analysis; each event picks one via `severity` (or an explicit
# `rate` to override). `2013-01-18` is the Phase 1 hot summer weekday for
# household 8596070 -- January falls within the summer peak months above,
# so on a non-CPP hour that day the normal summer peak rate (0.55) applies;
# the CPP event below overrides just its 17:00-20:00 window.
cpp:
  rates:
    moderate: 1.20        # CONFIRM: $/kWh, representative
    severe: 2.50           # CONFIRM: $/kWh, representative -- sensitivity variant
  events:
    - date: "2013-01-18"
      start: "17:00"
      end: "20:00"
      severity: moderate
