# Ausgrid-style residential TOU tariff -- BUILD_SPEC.md §9.
# Every rate below is an illustrative placeholder (CONFIRM): replace with a
# real, current Ausgrid residential TOU schedule before results are reported.

rates:
  peak:
    rate: 0.55          # CONFIRM: $/kWh, placeholder
    windows:             # CONFIRM: weekday peak window, placeholder
      - days: [mon, tue, wed, thu, fri]
        start: "14:00"
        end: "20:00"
  shoulder:
    rate: 0.22          # CONFIRM: $/kWh, placeholder
    windows: []          # CONFIRM: implicitly "everything not peak/off-peak"
  off_peak:
    rate: 0.12          # CONFIRM: $/kWh, placeholder
    windows:             # CONFIRM: placeholder
      - days: [mon, tue, wed, thu, fri, sat, sun]
        start: "22:00"
        end: "07:00"

# CPP (Critical Peak Pricing) events: on flagged days, override a window
# with a price spike to stress-test elasticity (§9, §10).
cpp:
  rate_min: 1.00        # CONFIRM: $/kWh, placeholder
  rate_max: 1.50        # CONFIRM: $/kWh, placeholder
  window_hours_min: 2   # CONFIRM: placeholder
  window_hours_max: 4   # CONFIRM: placeholder
  event_days: []         # CONFIRM: schedule of CPP days, placeholder -- e.g. ["2026-01-15"]
