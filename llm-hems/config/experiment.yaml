# Ties config/{appliances,tariff,household}.yaml together for one run --
# BUILD_SPEC.md §3, §6.3. Every run writes its fully resolved config + seed
# into its results folder (design principle §2.3).

agent: llm                       # stub | milp | noisy_milp | llm -- llm implemented Phase 2

horizon_days: 1                  # BUILD_SPEC.md §4: default one day = 48 steps; extend for elasticity
steps_per_day: 48

seed: 42                         # CONFIRM: placeholder base seed
n_seeds: 1                       # Phase 2 development value (BUILD_SPEC.md §6.3 default is 3 for
                                  # reporting spread -- raise once the agent is stable; not currently
                                  # wired to n independent LLM calls per step, see llm.dry_run note)

llm:
  # Provider selection (BUILD_SPEC.md §14: LLM SDKs live behind llm/client.py
  # so neither leaks into agent logic). `run_single.py --provider` overrides
  # this per-run; the reliability battery (experiments/reliability_battery.py)
  # runs both providers regardless of this setting. Flipped matilda -> gemini
  # after the v1-v3 probes: Matilda's chat.create_object exposes no
  # temperature/seed parameter (see the `matilda:` block below), so it can't
  # meet the T=0+seed determinism requirement this project now depends on.
  provider: gemini                # matilda | gemini

  # Reproducibility (BUILD_SPEC.md §2.3, §6.3): T=0 alone was NOT sufficient
  # for two identical prompts to return an identical wtp in
  # probe_wtp_price_v3.py's determinism check -- the seed is required as
  # well. Both are passed into Gemini's GenerateContentConfig on every call
  # (llm/client.py); Matilda's API exposes neither (see below), so these
  # only take effect for provider: gemini.
  temperature: 0.0
  seed: 42

  matilda:
    # Maincode's Matilda API (matilda-client SDK). Matilda owns model/provider
    # routing internally -- chat.create_object exposes no `model`,
    # `temperature`, or `seed` parameter, so there is nothing to CONFIRM here
    # beyond the SDK version. REPRODUCIBILITY LIMITATION: since the model
    # version and sampling behaviour behind each call are entirely
    # provider-controlled and unpinned, `sdk_version` + `confirmed_date` below
    # is the only trace of which API surface produced a given run's results --
    # re-check `pip show matilda-client` before trusting a comparison against
    # an older run. See README.md "Reproducibility: the LLM agent" and the
    # run-to-run variance check in experiments/phase2_diagnostics.py --
    # observed spread across 3 reps of the same day is logged in
    # results/phase2_diagnostics/diagnostics_summary.json (run 2026-09-06).
    base_url: https://matilda.maincode.com/api
    sdk_version: matilda-client==0.3.0   # `pip show matilda-client`; bump when the SDK is upgraded
    confirmed_date: "2026-09-06"         # date this pipeline last confirmed working end to end
    model: null                    # not exposed by the API -- see note above
    temperature: null              # not exposed by the API -- see note above
    seed: null                     # not exposed by the API -- see note above

  gemini:
    # Google's google-genai SDK against the Gemini Developer API
    # (GEMINI_API_KEY). CONFIRM before reporting results: model live-tested
    # 2026-09-06 -- gemini-2.5-flash has been retired (API 404s and points to
    # gemini-3.6-flash); gemini-3.8-flash exists but returned 503 "high
    # demand" at test time. gemini-3.6-flash itself works but its free tier
    # is capped at 20 requests/DAY per project+model, which a ~26-call
    # battery exhausts by itself -- gemini-3.5-flash-lite (same Flash
    # family, lighter tier) has no such daily ceiling and is the workable
    # default here. Re-check both models' quotas before a later run.
    model: gemini-3.5-flash-lite
    sdk_version: null              # filled in from the installed package at runtime (llm/client.py)
    rate_limit_rpm: 5              # observed free-tier cap for this model/key (2026-09-06): the API's
                                    # own 429 response reported quota=5 req/min, not the commonly-cited
                                    # 15 -- llm/client.py throttles calls to this before sending.
    max_output_tokens: 2048        # generous: gemini-3.x "thinking" consumes hidden budget
                                    # before the JSON body -- smaller values truncated responses
                                    # in testing.

  dry_run: false                 # BUILD_SPEC.md §15: --dry-run CLI flag overrides this for pipeline
                                  # testing without spend; this default governs config-driven runs
  cache_path: results/llm_cache.json   # disk cache of (provider, prompt) -> response, reused across runs

noisy_milp:
  comfort_band_jitter_c: 0.5     # CONFIRM: placeholder
  setpoint_jitter_c: 0.5         # CONFIRM: placeholder
  deadline_jitter_steps: 1       # CONFIRM: placeholder
  # CONFIRM: placeholder, but load-bearing -- without *some* perceived-price
  # noise, washer start time reliably ties back to the same slot as the
  # clean MILP (the tariff has flat-rate blocks, so comfort/deadline jitter
  # alone rarely breaks the LP's tie-break). 0.02 ($/kWh) was the smallest
  # value in a 0/0.02/0.05 sweep that made noisy-MILP washer timing stagger
  # relative to clean MILP across seeds on household 8596070 (Part 1b).
  price_noise_std: 0.02

rule_based:
  # RuleBasedSatisficerAgent (agents/rule_based_agent.py): the LLM agent with
  # the LLM swapped for a formula, same Python halt (U = wtp - cost_now at
  # global_scale 1.0, factor 1.0 in experiments/run_rule_based.py).
  #   HVAC   WTP = hvac_k[comfort_orientation] * max(0, T_in - band_ceiling)
  #   washer WTP = washer_w_max * clamp(1 - slack / slack_at_release, 0, 1)
  # LEVEL-MATCHED, not free: least squares through the origin of raw LLM WTP
  # on each regressor, one row per distinct prompt -- experiments/fit_rule_based.py
  # -> results/phase3/rule_based/fit.json (values below = that output, 3 dp).
  # hvac_k: live comfort sweep log (results/phase3/comfort_sweep/live/).
  # washer_w_max: live slice log (results/phase3/live_slice/) -- the comfort
  # sweep never started the washer; the slice is the only live washer WTP
  # (13 distinct prompts, 2 households), so w_max is the weaker of the fits.
  hvac_k:                          # $ per degC over the band ceiling
    comfort_prioritising: 2.712
    balanced: 0.620
    comfort_flexible: 0.511
  washer_w_max: 0.888              # $ at zero slack

results_dir: results             # timestamped run folders written here (gitignored)

# ---------------------------------------------------------------------------
# Phase 3 (elasticity) -- experiments/run_phase3.py, experiments/calibrate.py.
# ---------------------------------------------------------------------------
phase3:
  persona_assignment: config/persona_assignment.csv   # built by experiments/build_personas.py

  # Each date is simulated twice with only the tariff differing: a baseline
  # day (no CPP at all) and a CPP day (exactly the event below). Same base
  # load, same weather, same household -> dQ is purely the agent's response.
  # Adding dates multiplies LLM spend linearly (see the budget gate).
  dates: ["2013-01-18"]            # hot summer Friday (Phase 1 reference day)
  cpp:
    start: "17:00"
    end: "20:00"                    # inside the 15:00-21:00 summer peak -> 0.55 -> 1.20 $/kWh
    severity: moderate
  rebound_hours: 2                  # post-event window for the rebound-peak metric
  elasticity_method: base           # base = BUILD_SPEC §10 formula; midpoint also reported

  # Deterministic WTP scaling applied in Python (agents/llm_agent.py):
  #   effective_WTP = LLM_WTP x global_scale x archetype_factors[archetype]
  # The LLM carries only the comfort valuation (comfort-orientation persona);
  # cost sensitivity (energy-burden archetype A/B/C, config/persona.yaml)
  # enters here and is never shown to the model. global_scale is the value
  # used when not calibrating -- calibration sweeps `calibration.scale_grid`
  # in its place, with the archetype factors held fixed.
  wtp_scaling:
    global_scale: 1.0
    archetype_factors:              # A = low burden (least cost-sensitive) ... C = high burden
      A: 1.3
      B: 1.0
      C: 0.7

  seeds: [42, 43, 44]               # run-to-run spread (T=0 is deterministic per seed)
  llm_cache_path: results/phase3/llm_cache.jsonl   # append-only, reused across every Phase 3 run

  calibration:
    # PRE-REGISTERED (fixed before any live calibration run):
    #   split  : `fraction` of households per archetype -> calibration, rest held out,
    #            shuffled within archetype by `split_seed`.
    #   fit    : one global wtp_scale (= wtp_scaling.global_scale), chosen from `scale_grid` at `fit_seed` as the
    #            grid value whose POOLED whole-household (total) elasticity on the
    #            calibration subset is inside `conway_range` and closest to
    #            `target_elasticity`; if none is inside, the closest overall, flagged.
    #   report : elasticity on the held-out subset at the frozen scale.
    # target -0.25 = arithmetic midpoint of Conway 2020's -0.026..-0.47 range
    # (CONFIRM against Conway's own central estimate if one is reported).
    fraction: 0.5
    split_seed: 42
    fit_seed: 42
    target_elasticity: -0.25
    conway_range: [-0.47, -0.026]
    scale_grid: [0.25, 0.5, 1.0, 2.0, 4.0]

  scenario:
    # Discriminating scenario (BUILD_SPEC §12): one unexpected CPP spike, washer
    # deadline near it. Coherent satisficing = defer past the spike when slack
    # allows (slack_remains), run through it when the deadline forces it
    # (deadline_forces). Judged against the scenario's TRUE deadline.
    spike:
      start: "18:00"
      end: "19:00"
      severity: severe
    variants:
      slack_remains:   {washer_release: "17:30", washer_deadline: "21:30"}
      deadline_forces: {washer_release: "17:30", washer_deadline: "20:00"}

  live_slice:
    households: [8596070, 9911140]  # C (burden 7.6%) vs A (1.35%): same +/-2.0 band, same
                                    # evening window -> the contrast isolates price_sensitivity
    seed: 42
    max_live_households: 3          # budget gate: a live run over more households than this
                                    # refuses to start without --approve-budget
